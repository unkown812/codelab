<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <title>CodeLab — Online Compiler</title>

 <meta name="description" content="Write, compile and run code online with CodeLab." />

 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
 <link rel="apple-touch-icon" href="favicon.png">
 
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

 <style>

  * {
   margin: 0;
   padding: 0;
   box-sizing: border-box;
  }

  html {
   scroll-behavior: smooth;
  }

  body {
   font-family: "Inter", sans-serif;
   background:
    radial-gradient(circle at 20% 10%,
     rgba(99, 102, 241, 0.15),
     transparent 35%),
    radial-gradient(circle at 80% 20%,
     rgba(14, 165, 233, 0.1),
     transparent 30%),
    #070b12;
   color: #f8fafc;
   min-height: 100%;
   overflow-x: hidden;
   margin-bottom: 0;
   margin-top: 10vh;
  }

  a {
   color: inherit;
   text-decoration: none;
  }

  strong {
   font-size: 24px;
  }

  /* =========================
       NAVBAR
    ========================== */

  .navbar {
   width: 100%;
   height: 72px;

   display: flex;
   align-items: center;
   justify-content: space-between;

   padding: 0 clamp(20px, 5vw, 80px);

   background: rgba(7, 11, 18, 0.75);
   border-bottom: 1px solid rgba(255, 255, 255, 0.07);

   backdrop-filter: blur(18px);
   -webkit-backdrop-filter: blur(18px);

   position: sticky;
   top: 0;
   z-index: 100;
  }

  .brand {
   display: flex;
   align-items: center;
   gap: 12px;

   font-size: 20px;
   font-weight: 800;
   letter-spacing: -0.5px;
  }

  .brand-icon {
   width: 36px;
   height: 36px;

   display: grid;
   place-items: center;

   border-radius: 10px;

   background: linear-gradient(135deg,
     #6366f1,
     #06b6d4);

   color: white;
   font-size: 17px;
   font-weight: 800;

   box-shadow:
    0 8px 25px rgba(99, 102, 241, 0.3);
  }

  .nav-links {
   display: flex;
   align-items: center;
   gap: 28px;

   color: #94a3b8;
   font-size: 14px;
   font-weight: 500;
  }

  .nav-links a {
   transition: color 0.2s ease;
  }

  .nav-links a:hover {
   color: #ffffff;
  }

  .nav-button {
   padding: 9px 16px;
   border-radius: 9px;

   background: #ffffff;
   color: #070b12 !important;

   font-weight: 600;

   transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
  }

  .nav-button:hover {
   transform: translateY(-1px);
   box-shadow: 0 8px 25px rgba(255, 255, 255, 0.12);
  }

  /* =========================
       HERO
    ========================== */

  .hero {
   max-width: 1200px;
   margin: 0 auto;

   padding:
    clamp(60px, 9vw, 110px) 20px clamp(50px, 7vw, 80px);

   text-align: center;
  }

  .badge {
   display: inline-flex;
   align-items: center;
   gap: 8px;

   padding: 7px 12px;

   border: 1px solid rgba(99, 102, 241, 0.25);
   border-radius: 999px;

   background: rgba(99, 102, 241, 0.08);

   color: #a5b4fc;

   font-size: 12px;
   font-weight: 600;

   margin-bottom: 24px;
  }

  .badge-dot {
   width: 7px;
   height: 7px;

   border-radius: 50%;

   background: #22c55e;

   box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
  }

  .hero h1 {
   max-width: 900px;
   margin: 0 auto;

   font-size: clamp(42px, 7vw, 76px);

   line-height: 1.02;
   letter-spacing: -3px;

   font-weight: 800;
  }

  .gradient-text {
   background:
    linear-gradient(90deg,
     #818cf8,
     #22d3ee,
     #a78bfa);

   -webkit-background-clip: text;
   background-clip: text;

   color: transparent;
  }

  .hero p {
   max-width: 650px;

   margin: 25px auto 0;

   color: #94a3b8;

   font-size: clamp(15px, 2vw, 18px);
   line-height: 1.7;
  }

  /* =========================
       COMPILER
    ========================== */

  .compiler-section {
   width: min(1400px, calc(100% - 32px));

   margin: 0 auto 90px;
  }

  .compiler-header {
   display: flex;
   align-items: center;
   justify-content: space-between;

   padding: 15px 18px;

   background: rgba(15, 23, 42, 0.85);

   border:
    1px solid rgba(255, 255, 255, 0.08);

   border-bottom: none;

   border-radius: 16px 16px 0 0;

   backdrop-filter: blur(14px);
  }

  .compiler-title {
   display: flex;
   align-items: center;
   gap: 10px;

   font-size: 14px;
   font-weight: 600;
  }

  .window-controls {
   display: flex;
   gap: 6px;
  }

  .window-dot {
   width: 10px;
   height: 10px;

   border-radius: 50%;

   background: #475569;
  }

  .compiler-status {
   display: flex;
   align-items: center;
   gap: 8px;

   color: #94a3b8;
   font-size: 12px;
  }

  .status-dot {
   width: 7px;
   height: 7px;

   border-radius: 50%;

   background: #22c55e;

   box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
  }

  .compiler-wrapper {
   position: relative;

   width: 100%;

   overflow: hidden;

   background: #0f172a;

   border:
    1px solid rgba(255, 255, 255, 0.08);

   border-radius: 0 0 16px 16px;

   box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.35),
    0 0 0 1px rgba(255, 255, 255, 0.02);
  }

  .compiler-wrapper iframe {
   display: block;

   width: 100%;

   height: clamp(600px, 75vh, 850px);

   border: none;

   background: #0f172a;
  }

  /* =========================
       FEATURES
    ========================== */

  .features {
   max-width: 1100px;

   margin: 0 auto;

   padding: 0 20px 90px;

   display: grid;

   grid-template-columns:
    repeat(3, 1fr);

   gap: 18px;
  }

  .feature {
   padding: 26px;

   border:
    1px solid rgba(255, 255, 255, 0.07);

   border-radius: 16px;

   background:
    linear-gradient(145deg,
     rgba(255, 255, 255, 0.045),
     rgba(255, 255, 255, 0.015));

   transition:
    transform 0.25s ease,
    border-color 0.25s ease;
  }

  .feature:hover {
   transform: translateY(-4px);

   border-color:
    rgba(129, 140, 248, 0.35);
  }

  .feature-icon {
   width: 42px;
   height: 42px;

   display: grid;
   place-items: center;

   margin-bottom: 18px;

   border-radius: 11px;

   background: rgba(99, 102, 241, 0.12);

   color: #a5b4fc;

   font-size: 18px;
  }

  .feature h3 {
   font-size: 15px;
   margin-bottom: 8px;
  }

  .feature p {
   color: #64748b;

   font-size: 13px;
   line-height: 1.6;
  }

  /* =========================
       FOOTER
    ========================== */

  footer {
   padding: 30px 20px;

   border-top:
    1px solid rgba(255, 255, 255, 0.06);

   text-align: center;

   color: #64748b;

   font-size: 12px;
  }

  footer strong {
   color: #94a3b8;
  }

  @media (max-width: 850px) {

   .nav-links {
    gap: 16px;
   }

   .nav-links a:not(.nav-button) {
    display: none;
   }

   .features {
    grid-template-columns: 1fr;
   }

   .compiler-section {
    width: calc(100% - 20px);
   }

   .compiler-wrapper iframe {
    height: 700px;
   }
  }

  /* =========================
       MOBILE
    ========================== */

  @media (max-width: 600px) {

   .navbar {
    height: 64px;

    padding: 0 16px;
   }

   .brand {
    font-size: 17px;
   }

   .brand-icon {
    width: 32px;
    height: 32px;

    border-radius: 8px;
   }

   .nav-button {
    padding: 8px 12px;
    font-size: 12px;
   }

   .hero {
    padding-top: 65px;
    padding-bottom: 50px;
   }

   .hero h1 {
    letter-spacing: -2px;
   }

   .hero p {
    margin-top: 18px;
   }

   .compiler-section {
    width: calc(100% - 12px);

    margin-bottom: 60px;
   }

   .compiler-header {
    padding: 12px;
   }

   .compiler-status {
    display: none;
   }

   .compiler-wrapper iframe {
    height: 650px;
   }
  }
 </style>
</head>

<body>
 <main>
  <section class="compiler-section" id="compiler">

   <div class="compiler-header">

    <div class="compiler-title">

     <div class="window-controls">
      <span class="window-dot"></span>
      <span class="window-dot"></span>
      <span class="window-dot"></span>
     </div>

     <span>Code Editor</span>

    </div>

    <div class="compiler-status">
     <span class="status-dot"></span>
     Ready to compile
    </div>

   </div>


   <div class="compiler-wrapper">

    <iframe id="onecompiler" src="https://onecompiler.com/embed/?theme=dark&hideTitle=true&codeChangeEvent=true"
     title="Online Code Compiler" loading="lazy" allow="clipboard-read; clipboard-write"></iframe>

   </div>

   <!-- <footer id="about">
    <p>
     <strong>CodeLab</strong>
     · Online coding environment
    </p>

    <p style="margin-top: 8px;">
     © 2026 CodeLab · Built for Developers
    </p>
   </footer> -->
  </section>


 </main>
</body>

</html>
